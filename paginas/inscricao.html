<!doctype html>
<html lang="pt-PT">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscrição | Clube de Basquetebol — cpw-11</title>
</head>

<body>
  <!-- Estrutura principal da página do Clube de Basquetebol -->

  <header>
    <h1>Inscrição no clube</h1>
    <nav>
      <ul>
        <li><a href="../index.html">Início</a></li>
        <li><a href="atividades.html">Atividades</a></li>
        <li><a href="inscricao.html">Inscrição</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Ficha de Inscrição</h2>
      <p>Preenche o formulário abaixo para te inscreveres numa das oficinas do nosso clube.</p>

      <form action="inscricao.html" method="get">
        <p>
          <label for="nome">Nome completo *</label><br>
          <input type="text" id="nome" name="nome" required>
        </p>

        <p>
          <label for="email">Endereço de email *</label><br>
          <input type="email" id="email" name="email" required>
        </p>

        <p>
          <label for="oficina">Escolha da oficina *</label><br>
          <select id="oficina" name="oficina" required>
            <option value="">-- Seleciona uma oficina --</option>
            <option value="captacao">Captação</option>
            <option value="tecnica">Técnica Individual</option>
            <option value="lancamento">Lançamento e Tática</option>
          </select>
        </p>

        <p>
          <label for="mensagem">Mensagem (opcional)</label><br>
          <textarea id="mensagem" name="mensagem" rows="4" cols="40"></textarea>
        </p>

        <p>
          <button type="submit">Testar inscrição</button>
        </p>
      </form>
    </section>
  </main>

  <footer>
    <p>Clube de Basquetebol · Projeto escolar de CPW</p>
  </footer>

</body>

</html>
